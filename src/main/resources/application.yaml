spring:
  application:
    name: AuthenticationJWT

  datasource:
      url: jdbc:postgresql://localhost:5432/jwt_guard
      username: postgres
      password: 123456
      driver-class-name: org.postgresql.Driver

  jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect